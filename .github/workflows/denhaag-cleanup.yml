name: Den Haag area cleanup

on:
  push:
    branches:
      - fix/den-haag-arrivals-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply area cleanup
        run: python tools/cleanup_denhaag_area.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add area/Earth/DenHaagArrivals.are
          git commit -m "Clean up Den Haag Arrivals area"
          git push
