name: Apply direct redit bexit fix

on:
  push:
    branches:
      - simplify-redit-bexit-fix

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-redit-bexit-fix
          fetch-depth: 0

      - name: Patch do_redit directly and remove wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('src/build.c')
          text = build.read_text()

          start_marker = '''   /*
           * Twisted and evil, but works           -Thoric
           * Makes an exit, and the reverse in one shot.
           */
          '''
          end_marker = '''   if( !str_cmp( arg, "exdistance" ) )
          '''

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''   /*
           * Create, change or remove a bidirectional exit.
           * Deletion is handled directly so each EXIT_DATA is removed from
           * the room that actually owns it. The reverse edge is matched by
           * both direction and source VNUM, never by direction alone.
           */
          if( !str_cmp( arg, "bexit" ) )
          {
             EXIT_DATA *nxit, *rxit;
             char tmpcmd[MAX_STRING_LENGTH];
             ROOM_INDEX_DATA *tmploc, *destroom;
             int vnum, exnum;
             char rvnum[MAX_INPUT_LENGTH];
             bool numnotdir;

             argument = one_argument( argument, arg2 );
             argument = one_argument( argument, arg3 );
             if( arg2[0] == '\0' )
             {
                send_to_char( "Create, change or remove a two-way exit.\r\n", ch );
                send_to_char( "Usage: redit bexit <dir> [room] [flags] [key] [keywords]\r\n", ch );
                return;
             }

             numnotdir = FALSE;
             switch ( arg2[0] )
             {
                default:
                   edir = get_dir( arg2 );
                   break;
                case '#':
                   numnotdir = TRUE;
                   edir = atoi( arg2 + 1 );
                   break;
                case '+':
                   edir = get_dir( arg2 + 1 );
                   break;
             }

             tmploc = location;
             exnum = edir;
             if( numnotdir )
             {
                nxit = get_exit_num( tmploc, edir );
                if( nxit )
                   edir = nxit->vdir;
             }
             else
                nxit = get_exit( tmploc, edir );

             /* No destination means delete the existing two-way exit. */
             if( arg3[0] == '\0' )
             {
                if( !nxit )
                {
                   send_to_char( "No exit in that direction.\r\n", ch );
                   return;
                }

                destroom = nxit->to_room;
                rxit = NULL;
                if( destroom )
                   rxit = get_exit_to( destroom, rev_dir[edir], tmploc->vnum );

                if( rxit && !can_rmodify( ch, destroom ) )
                   return;

                if( rxit && rxit != nxit )
                   extract_exit( destroom, rxit );

                extract_exit( tmploc, nxit );
                send_to_char( rxit ? "Two-way exit removed.\r\n"
                                   : "Exit removed; no matching reverse exit existed.\r\n", ch );
                return;
             }

             /* Creation/change keeps the established editor behaviour. */
             rxit = NULL;
             vnum = 0;
             rvnum[0] = '\0';
             if( nxit )
             {
                vnum = nxit->vnum;
                snprintf( rvnum, MAX_INPUT_LENGTH, "%d", tmploc->vnum );
                if( nxit->to_room )
                   rxit = get_exit_to( nxit->to_room, rev_dir[edir], tmploc->vnum );
             }

             snprintf( tmpcmd, MAX_STRING_LENGTH, "exit %s %s %s", arg2, arg3, argument );
             do_redit( ch, tmpcmd );

             if( numnotdir )
                nxit = get_exit_num( tmploc, exnum );
             else
                nxit = get_exit( tmploc, edir );

             if( !rxit && nxit )
             {
                vnum = nxit->vnum;
                snprintf( rvnum, MAX_INPUT_LENGTH, "%d", tmploc->vnum );
                if( nxit->to_room )
                   rxit = get_exit_to( nxit->to_room, rev_dir[edir], tmploc->vnum );
             }

             if( vnum )
             {
                snprintf( tmpcmd, MAX_STRING_LENGTH, "%d redit exit %d %s %s",
                          vnum, rev_dir[edir], rvnum, argument );
                do_at( ch, tmpcmd );
             }
             return;
          }

          '''

          build.write_text(text[:start] + replacement + text[end:])

          makefile = Path('src/Makefile')
          make = makefile.read_text()
          make = make.replace('player.c redit_safe.c reset.c', 'player.c reset.c')
          make = make.replace('''#
          # Safe online room editing
          #
          # build.c retains the inherited editor behind a legacy symbol. redit_safe.c
          # intercepts only no-destination `bexit` removal so the reverse edge is matched
          # by destination VNUM and deleted from its actual owning room.
          o/build.o: C_FLAGS += -Ddo_redit=legacy_do_redit

          ''', '')
          makefile.write_text(make)

          wrapper = Path('src/redit_safe.c')
          if wrapper.exists():
              wrapper.unlink()

          workflow = Path('.github/workflows/apply-redit-direct-fix.yml')
          workflow.unlink()
          PY

      - name: Clean build
        run: |
          make -C src clean
          make -C src -j2

      - name: Commit direct fix
        shell: bash
        run: |
          git config user.name "ZeroPoint Build Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Simplify redit bexit safety fix"
          git push origin HEAD:simplify-redit-bexit-fix
