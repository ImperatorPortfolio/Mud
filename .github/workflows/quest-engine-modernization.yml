name: Quest engine modernization

on:
  push:
    branches:
      - feature/quest-engine-modernization
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply quest integration
        run: python tools/apply_quest_engine.py

      - name: Build Zero Point
        run: make -C src clean all

      - name: Verify generated diff
        run: |
          git diff --check
          git status --short

      - name: Commit integrated quest engine
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mud.h \
            src/character/player.h \
            src/game/api.h \
            src/db.c \
            src/save.c \
            src/Makefile \
            src/mud_prog.c \
            system/commands.dat \
            area/Earth/DenHaagArrivals.are
          if git diff --cached --quiet; then
            echo "No generated integration changes"
            exit 0
          fi
          git commit -m "Integrate persistent quest engine"
          git push
