name: Quest engine modernization

on:
  push:
    branches:
      - feature/quest-engine-modernization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Zero Point
        run: make -C src clean all

      - name: Verify source tree
        run: git diff --check
