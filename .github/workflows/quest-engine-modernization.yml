name: Quest engine modernization

on:
  push:
    branches:
      - feature/quest-engine-modernization
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Fix helper speech-hook matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_quest_engine.py')
          s = p.read_text(encoding='utf-8')
          old = '''needle = '                  mprog_driver( mprg->comlist, mob, actor, obj, vo, FALSE );\\n                  break;'
          if chunk.count(needle) != 2:
              raise RuntimeError(f'interact event: expected 2 speech driver sites, found {chunk.count(needle)}')
          chunk = chunk.replace(
              needle,
              '                  mprog_driver( mprg->comlist, mob, actor, obj, vo, FALSE );\\n'
              '                  if( actor && !IS_NPC( actor ) && mob && mob->pIndexData && ( type & SPEECH_PROG ) )\\n'
              '                     quest_event( actor, QUEST_OBJECTIVE_INTERACT, mob->pIndexData->vnum, 0 );\\n'
              '                  break;')
          '''
          new = '''speech_driver = re.compile(
              r'(?P<indent> +)mprog_driver\\( mprg->comlist, mob, actor, obj, vo, FALSE \\);\\n(?P=indent)break;')
          matches = list(speech_driver.finditer(chunk))
          if len(matches) != 2:
              raise RuntimeError(f'interact event: expected 2 speech driver sites, found {len(matches)}')
          def add_interact_event(match):
              indent = match.group('indent')
              return (
                  indent + 'mprog_driver( mprg->comlist, mob, actor, obj, vo, FALSE );\\n' +
                  indent + 'if( actor && !IS_NPC( actor ) && mob && mob->pIndexData && ( type & SPEECH_PROG ) )\\n' +
                  indent + '   quest_event( actor, QUEST_OBJECTIVE_INTERACT, mob->pIndexData->vnum, 0 );\\n' +
                  indent + 'break;')
          chunk = speech_driver.sub(add_interact_event, chunk)
          '''
          if old not in s:
              raise SystemExit('speech-hook helper block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply quest integration
        run: python tools/apply_quest_engine.py

      - name: Build Zero Point
        run: make -C src clean all

      - name: Verify generated diff
        run: |
          git diff --check
          git status --short

      - name: Commit integrated quest engine
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/mud.h \
            src/character/player.h \
            src/game/api.h \
            src/db.c \
            src/save.c \
            src/Makefile \
            src/mud_prog.c \
            system/commands.dat \
            area/Earth/DenHaagArrivals.are
          if git diff --cached --quiet; then
            echo "No generated integration changes"
            exit 0
          fi
          git commit -m "Integrate persistent quest engine"
          git push
