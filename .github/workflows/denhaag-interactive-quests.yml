name: Den Haag interactive quests

on:
  push:
    branches:
      - feature/den-haag-interactive-quests

permissions:
  contents: write

jobs:
  build-area:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build and validate Den Haag interactions
        run: python tools/build_denhaag_interactive.py
      - name: Commit generated area
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No area changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add area/Earth/DenHaagArrivals.are
          git commit -m "Add Den Haag interactive quests"
          git push
