name: Apply bexit safety fix

on:
  push:
    branches:
      - fix-redit-bexit-asymmetric-rexit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[bexit-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch direct do_redit bexit deletion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/build.c')
          text = path.read_text()

          old = '''         if( reverse && reverse != nxit )
         {
            /* Removing the forward edge clears reverse->rexit while both
             * allocations are still valid. */
            extract_exit( tmploc, nxit );
            extract_exit( destination, reverse );
         }
         else
            extract_exit( tmploc, nxit );
'''

          new = '''         if( reverse && reverse != nxit )
         {
            /*
             * Legacy or previously edited areas can contain asymmetric
             * rexit pointers. extract_exit() dereferences pexit->rexit, so
             * sever both known-live exit objects before either allocation is
             * freed. The exact reverse edge was already resolved above by
             * destination VNUM and reverse direction.
             */
            nxit->rexit = NULL;
            reverse->rexit = NULL;

            extract_exit( destination, reverse );
            extract_exit( tmploc, nxit );
         }
         else
         {
            /* A stale rexit must never be dereferenced during one-sided
             * cleanup. */
            nxit->rexit = NULL;
            extract_exit( tmploc, nxit );
         }
'''

          if old not in text:
              raise SystemExit('Expected bexit deletion block was not found; refusing to patch')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source fix and remove temporary workflow
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "ZeroPoint Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temp-bexit-fix.yml
          git add src/build.c
          git commit -m "Fix bexit deletion with asymmetric reverse links [bexit-fix-applied]"
          git push origin HEAD:$BRANCH
