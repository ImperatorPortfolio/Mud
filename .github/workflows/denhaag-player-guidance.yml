name: Den Haag player guidance

on:
  push:
    branches:
      - feature/den-haag-player-guidance

permissions:
  contents: write

jobs:
  fix-area:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fix player guidance and back areas
        run: python tools/fix_denhaag_player_guidance.py
      - name: Commit updated area
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No area changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add area/Earth/DenHaagArrivals.are
          git commit -m "Fix Den Haag player guidance and shop back areas"
          git push
