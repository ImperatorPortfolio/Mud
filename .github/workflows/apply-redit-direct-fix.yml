name: Apply direct redit bexit fix

on:
  push:
    branches:
      - simplify-redit-bexit-fix
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    if: github.head_ref == 'simplify-redit-bexit-fix' || github.ref_name == 'simplify-redit-bexit-fix'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-redit-bexit-fix
          fetch-depth: 0

      - name: Patch do_redit directly and remove wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('src/build.c')
          text = build.read_text()
          start_marker = '   if( !str_cmp( arg, "bexit" ) )\n'
          end_marker = '   if( !str_cmp( arg, "exdistance" ) )\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''   if( !str_cmp( arg, "bexit" ) )
          {
             EXIT_DATA *nxit, *rxit;
             char tmpcmd[MAX_STRING_LENGTH];
             ROOM_INDEX_DATA *tmploc, *destroom;
             int vnum, exnum;
             char rvnum[MAX_INPUT_LENGTH];
             bool numnotdir;

             argument = one_argument( argument, arg2 );
             argument = one_argument( argument, arg3 );
             if( arg2[0] == '\0' )
             {
                send_to_char( "Create, change or remove a two-way exit.\r\n", ch );
                send_to_char( "Usage: redit bexit <dir> [room] [flags] [key] [keywords]\r\n", ch );
                return;
             }

             numnotdir = FALSE;
             switch ( arg2[0] )
             {
                default:
                   edir = get_dir( arg2 );
                   break;
                case '#':
                   numnotdir = TRUE;
                   edir = atoi( arg2 + 1 );
                   break;
                case '+':
                   edir = get_dir( arg2 + 1 );
                   break;
             }

             tmploc = location;
             exnum = edir;
             if( numnotdir )
             {
                nxit = get_exit_num( tmploc, edir );
                if( nxit )
                   edir = nxit->vdir;
             }
             else
                nxit = get_exit( tmploc, edir );

             /* Deleting a bexit is direct and ownership-safe. */
             if( arg3[0] == '\0' )
             {
                if( !nxit )
                {
                   send_to_char( "No exit in that direction.\r\n", ch );
                   return;
                }

                destroom = nxit->to_room;
                rxit = NULL;
                if( destroom )
                   rxit = get_exit_to( destroom, rev_dir[edir], tmploc->vnum );

                if( rxit && !can_rmodify( ch, destroom ) )
                   return;

                if( rxit && rxit != nxit )
                   extract_exit( destroom, rxit );
                extract_exit( tmploc, nxit );

                send_to_char( rxit ? "Two-way exit removed.\r\n"
                                   : "Exit removed; no matching reverse exit existed.\r\n", ch );
                return;
             }

             /* Creation/change retains the existing editor behaviour, while
              * reverse lookup is exact rather than direction-only. */
             rxit = NULL;
             vnum = 0;
             rvnum[0] = '\0';
             if( nxit )
             {
                vnum = nxit->vnum;
                snprintf( rvnum, MAX_INPUT_LENGTH, "%d", tmploc->vnum );
                if( nxit->to_room )
                   rxit = get_exit_to( nxit->to_room, rev_dir[edir], tmploc->vnum );
             }

             snprintf( tmpcmd, MAX_STRING_LENGTH, "exit %s %s %s", arg2, arg3, argument );
             do_redit( ch, tmpcmd );
             if( numnotdir )
                nxit = get_exit_num( tmploc, exnum );
             else
                nxit = get_exit( tmploc, edir );

             if( !rxit && nxit )
             {
                vnum = nxit->vnum;
                snprintf( rvnum, MAX_INPUT_LENGTH, "%d", tmploc->vnum );
                if( nxit->to_room )
                   rxit = get_exit_to( nxit->to_room, rev_dir[edir], tmploc->vnum );
             }
             if( vnum )
             {
                snprintf( tmpcmd, MAX_STRING_LENGTH, "%d redit exit %d %s %s",
                          vnum, rev_dir[edir], rvnum, argument );
                do_at( ch, tmpcmd );
             }
             return;
          }

'''
          build.write_text(text[:start] + replacement + text[end:])

          makefile = Path('src/Makefile')
          make = makefile.read_text()
          make = make.replace('player.c redit_safe.c reset.c', 'player.c reset.c')
          block_start = make.find('#\n# Safe online room editing\n#')
          if block_start != -1:
              block_end = make.find('\n#\n#', block_start + 3)
              if block_end == -1:
                  raise RuntimeError('could not locate end of redit Makefile block')
              make = make[:block_start] + make[block_end + 1:]
          makefile.write_text(make)

          wrapper = Path('src/redit_safe.c')
          if wrapper.exists():
              wrapper.unlink()
          Path('.github/workflows/apply-redit-direct-fix.yml').unlink()
          PY

      - name: Clean build
        run: |
          make -C src clean
          make -C src -j2

      - name: Commit direct fix
        shell: bash
        run: |
          git config user.name "ZeroPoint Build Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Simplify redit bexit safety fix"
          git push origin HEAD:simplify-redit-bexit-fix
